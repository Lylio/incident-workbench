name: incident-workbench
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workbench
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench_dev
    ports:
      - "127.0.0.1:${WORKBENCH_DB_PORT:-55493}:5432"
    volumes:
      - workbench-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench -d workbench"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/workbench
      DB_USER: workbench
      DB_PASSWORD: workbench_dev
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    ports:
      - "127.0.0.1:${WORKBENCH_API_PORT:-58493}:8080"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WORKBENCH_UI_PORT:-53493}:80"
    depends_on:
      - backend
volumes:
  workbench-data:
