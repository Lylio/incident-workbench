spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55493/workbench}
    username: ${DB_USER:workbench}
    password: ${DB_PASSWORD:workbench_dev}
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 4MB
  jackson:
    deserialization:
      accept-float-as-int: false
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
workbench:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4.1-mini}
management:
  endpoints:
    web:
      exposure:
        include: health,info
